<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KL STORE - Gerador de Letras & Fontes</title>
  <meta name="monetag" content="418d257eaff324217ca7ac485d524fd6">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
    }

    /* BANNER DISCORD */
    .discord-banner {
      width: 100%;
      max-width: 500px;
      background: linear-gradient(135deg, #5865F2, #404EED);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
    }

    .discord-info h2 {
      font-size: 1.1rem;
      color: #fff;
    }

    .discord-info p {
      font-size: 0.8rem;
      color: #e0e7ff;
    }

    .btn-discord {
      background: #fff;
      color: #5865F2;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #38bdf8;
      text-align: center;
    }

    p.sub {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
      text-align: center;
    }

    textarea {
      width: 100%;
      max-width: 500px;
      height: 90px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-size: 1rem;
      resize: none;
      outline: none;
      margin-bottom: 20px;
    }

    textarea:focus {
      border-color: #38bdf8;
    }

    .results-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      margin-right: 10px;
    }

    .card-title {
      font-size: 0.75rem;
      color: #38bdf8;
      text-transform: uppercase;
      font-weight: bold;
    }

    .card-text {
      font-size: 1.1rem;
      color: #f1f5f9;
      word-break: break-all;
    }

    .btn-copy {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* CARD PIX */
    .pix-card {
      width: 100%;
      max-width: 500px;
      background: #1e293b;
      border: 1px solid #22c55e;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .pix-title {
      font-size: 0.95rem;
      color: #22c55e;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .pix-sub {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .btn-pix {
      background: #22c55e;
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
    }

    /* PAINEL ADMIN */
    .admin-section {
      width: 100%;
      max-width: 500px;
      background: #1e293b;
      border: 2px dashed #38bdf8;
      border-radius: 12px;
      padding: 16px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .admin-title {
      font-size: 1rem;
      color: #38bdf8;
      font-weight: bold;
    }

    .admin-input-group {
      display: flex;
      gap: 8px;
    }

    .admin-input {
      flex: 1;
      padding: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: white;
    }

    .btn-admin {
      background: #22c55e;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .history-list {
      margin-top: 12px;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      border-left: 3px solid #38bdf8;
    }

    .history-time {
      font-size: 0.7rem;
      color: #64748b;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- BANNER DISCORD -->
  <div class="discord-banner">
    <div class="discord-info">
      <h2>KL STORE #200 👑</h2>
      <p>Entre no nosso Discord oficial!</p>
    </div>
    <a href="https://discord.gg/2dWzATkYZZ" target="_blank" class="btn-discord">Entrar</a>
  </div>

  <h1>✨ Modificador de Letras</h1>
  <p class="sub">Personalize textos para Nick, Bio e Discord!</p>

  <textarea id="userInput" placeholder="Digite seu texto aqui..."></textarea>

  <div class="results-container" id="results"></div>

  <!-- SEÇÃO DE DOAÇÃO PIX -->
  <div class="pix-card">
    <div class="pix-title">☕ Apoie o Projeto</div>
    <div class="pix-sub">Gostou das fontes? Faça uma doação via PIX para ajudar o site!</div>
    <button class="btn-pix" onclick="copyPix()">Copiar Chave PIX</button>
  </div>

  <!-- PAINEL ADMIN -->
  <div class="admin-section">
    <div class="admin-header">
      <span class="admin-title">🔐 Painel do Dono (Admin)</span>
    </div>

    <div id="loginForm" class="admin-input-group">
      <input type="password" id="adminPassword" class="admin-input" placeholder="Digite a senha admin">
      <button class="btn-admin" onclick="loginAdmin()">Entrar</button>
    </div>

    <div id="adminPanel" class="hidden">
      <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 8px;">Acesso autorizado! Histórico de uso:</p>
      <button class="btn-copy" style="background: #ef4444; margin-bottom: 8px;" onclick="clearHistory()">Limpar Histórico</button>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script>
    const userInput = document.getElementById('userInput');
    const resultsContainer = document.getElementById('results');
    const pixKey = "be19c02b-7bf6-411c-bca5-9db1ce3ed701";

    const smallCapsMap = {
      'a':'ᴀ', 'b':'ʙ', 'c':'ᴄ', 'd':'ᴅ', 'e':'ᴇ', 'f':'ғ', 'g':'ɢ', 'h':'ʜ', 'i':'ɪ',
      'j':'ᴊ', 'k':'ᴋ', 'l':'ʟ', 'm':'ᴍ', 'n':'ɴ', 'o':'ᴏ', 'p':'ᴘ', 'q':'ǫ', 'r':'ʀ',
      's':'ꜱ', 't':'ᴛ', 'u':'ᴜ', 'v':'ᴠ', 'w':'ᴡ', 'x':'x', 'y':'ʏ', 'z':'ᴢ'
    };

    const flipMap = {
      'a':'ɐ', 'b':'q', 'c':'ɔ', 'd':'p', 'e':'ǝ', 'f':'ɟ', 'g':'ƃ', 'h':'ɥ', 'i':'ı',
      'j':'ɾ', 'k':'ʞ', 'l':'l', 'm':'ɯ', 'n':'u', 'o':'o', 'p':'d', 'q':'b', 'r':'ɹ',
      's':'s', 't':'ʇ', 'u':'n', 'v':'ʌ', 'w':'ʍ', 'x':'x', 'y':'ʎ', 'z':'z'
    };

    const superMap = {
      'a':'ᵃ', 'b':'ᵇ', 'c':'ᶜ', 'd':'ᵈ', 'e':'ᵉ', 'f':'ᶠ', 'g':'ᵍ', 'h':'ʰ', 'i':'ⁱ',
      'j':'ʲ', 'k':'ᵏ', 'l':'ˡ', 'm':'ᵐ', 'n':'ⁿ', 'o':'ᵒ', 'p':'ᵖ', 'r':'ʳ', 's':'ˢ',
      't':'ᵗ', 'u':'ᵘ', 'v':'ᵛ', 'w':'ʷ', 'x':'ˣ', 'y':'ʸ', 'z':'ᶻ'
    };

    const asianMap = {
      'a':'卂', 'b':'乃', 'c':'匚', 'd':'刀', 'e':'乇', 'f':'下', 'g':'G', 'h':'卄', 'i':'丨',
      'j':'丿', 'k':'Ҝ', 'l':'乚', 'm':'爪', 'n':'𠘨', 'o':'口', 'p':'卩', 'q':'Q', 'r':'尺',
      's':'丂', 't':'ㄒ', 'u':'ㄩ', 'v':'V', 'w':'山', 'x':'乂', 'y':'ㄚ', 'z':'乙'
    };

    function mapChars(str, startUpper, startLower, startNum) {
      return str.replace(/[a-zA-Z0-9]/g, ch => {
        let code = ch.charCodeAt(0);
        if (code >= 65 && code <= 90) return String.fromCodePoint(startUpper + (code - 65));
        if (code >= 97 && code <= 122) return String.fromCodePoint(startLower + (code - 97));
        if (code >= 48 && code <= 57 && startNum) return String.fromCodePoint(startNum + (code - 48));
        return ch;
      });
    }

    function toSmallCaps(str) {
      return str.toLowerCase().split('').map(ch => smallCapsMap[ch] || ch).join('');
    }

    function toFlip(str) {
      return str.split('').map(ch => flipMap[ch] || ch).reverse().join('');
    }

    function toSuper(str) {
      return str.toLowerCase().split('').map(ch => superMap[ch] || ch).join('');
    }

    function toAsian(str) {
      return str.toLowerCase().split('').map(ch => asianMap[ch] || ch).join('');
    }

    function toUmlaut(str) {
      return str.split('').map(c => c === ' ' ? ' ' : c + '\u0308').join('');
    }

    function toWavy(str) {
      return str.split('').join('〰');
    }

    function toFullWidth(str) {
      return str.split('').map(ch => {
        let code = ch.charCodeAt(0);
        if (code >= 33 && code <= 126) return String.fromCharCode(code + 0xFEE0);
        if (ch === ' ') return '  ';
        return ch;
      }).join('');
    }

    function convertText(text) {
      if (!text) text = "fontes especiais";

      const italicText = mapChars(text, 0x1D608, 0x1D622);
      const boldText = mapChars(text, 0x1D5A0, 0x1D5BA, 0x1D7E2);

      return [
        { title: "👗 Estilo Moda & Beleza", text: `${italicText} ✨👗👠` },
        { title: "💪 Fitness & Treino", text: `${boldText} 💪🥗🏋️` },
        { title: "✈️ Viagem & Mundo", text: `${italicText} 🌍✈️🏝️` },
        { title: "💼 Negócios & Trabalho", text: `${text} 💼📊🚀` },
        { title: "🌸 Fofo / Kawaii", text: `🌸 ✦ 🎀 ${italicText} 🎀 ✦ 🌸` },
        { title: "✨ Estrelas Neon", text: `✨ ${text} ✨` },
        { title: "♡ Corações Estilo Bio", text: `.♡. ${text} .♡.` },
        { title: "🎮 Canal Discord", text: '• ' + toSmallCaps(text.replace(/\s+/g, '-')) },
        { title: "🔤 Small Caps", text: toSmallCaps(text) },
        { title: "⛩️ Estilo Asiático / Manga", text: toAsian(text) },
        { title: "👑 Gótica / Fraktur", text: mapChars(text, 0x1D504, 0x1D51E) },
        { title: "✒️ Cursiva Elegante", text: mapChars(text, 0x1D4D0, 0x1D4EA) },
        { title: "🧱 Contorno / Double Struck", text: mapChars(text, 0x1D538, 0x1D552, 0x1D7D8) },
        { title: "📏 Texto Largo / Fullwidth", text: toFullWidth(text) },
        { title: "〰️ Ondulado", text: toWavy(text) },
        { title: "░ Efeito Pontilhado (Umlaut)", text: toUmlaut(text) },
        { title: "⚪ Bolinha Transparente", text: mapChars(text, 0x24B6, 0x24D0, 0x2460) },
        { title: "⚫ Bolinha Preenchida", text: mapChars(text, 0x1F150, 0x1F150) },
        { title: "🙃 De Cabeça Para Baixo", text: toFlip(text) },
        { title: "⬆️ Sobrescrito", text: toSuper(text) }
      ];
    }

    function updateList() {
      const text = userInput.value;
      const styles = convertText(text);

      resultsContainer.innerHTML = '';

      styles.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="card-info">
            <span class="card-title">${item.title}</span>
            <span class="card-text">${item.text}</span>
          </div>
          <button class="btn-copy" onclick="copyToClipboard('${item.text}', '${item.title}', this)">Copiar</button>
        `;

        resultsContainer.appendChild(card);
      });
    }

    function copyToClipboard(text, styleTitle, btn) {
      navigator.clipboard.writeText(text).then(() => {
        saveToHistory(text, styleTitle);

        const originalText = btn.innerText;
        btn.innerText = "Copiado!";
        btn.style.background = "#22c55e";
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.background = "#0284c7";
        }, 1500);
      });
    }

    function copyPix() {
      navigator.clipboard.writeText(pixKey).then(() => {
        alert("Chave PIX copiada com sucesso!");
      });
    }

    function saveToHistory(text, styleTitle) {
      let history = JSON.parse(localStorage.getItem('site_history') || '[]');
      const now = new Date().toLocaleTimeString('pt-BR');
      
      history.unshift({ text, styleTitle, time: now });
      localStorage.setItem('site_history', JSON.stringify(history));

      if (!document.getElementById('adminPanel').classList.contains('hidden')) {
        renderHistory();
      }
    }

    function loginAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === "15345140901Kl.") {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        renderHistory();
      } else {
        alert("Senha incorreta!");
      }
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      let history = JSON.parse(localStorage.getItem('site_history') || '[]');
      
      if (history.length === 0) {
        historyList.innerHTML = '<p style="color: #64748b; font-size: 0.8rem;">Nenhuma cópia registrada ainda.</p>';
        return;
      }

      historyList.innerHTML = history.map(item => `
        <div class="history-item">
          <div><strong>[${item.styleTitle}]</strong> ${item.text}</div>
          <div class="history-time">Horário: ${item.time}</div>
        </div>
      `).join('');
    }

    function clearHistory() {
      localStorage.removeItem('site_history');
      renderHistory();
    }

    userInput.addEventListener('input', updateList);
    updateList();
  </script>
</body>
  </html>
